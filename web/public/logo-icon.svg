<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="180" r="120" fill="url(#glow)"/>

  <!-- Outer ripple 1 -->
  <circle cx="200" cy="180" r="100" stroke="url(#brand)" stroke-width="3" fill="none" opacity="0.15"/>
  <!-- Outer ripple 2 -->
  <circle cx="200" cy="180" r="75" stroke="url(#brand)" stroke-width="2.5" fill="none" opacity="0.3"/>
  <!-- Outer ripple 3 -->
  <circle cx="200" cy="180" r="55" stroke="url(#brand)" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Inner pool -->
  <circle cx="200" cy="180" r="38" stroke="url(#brand)" stroke-width="3" fill="none" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="200" cy="180" r="12" fill="url(#brand)"/>

  <!-- Upward indicator line (prediction arrow) -->
  <line x1="200" y1="360" x2="200" y2="310" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="200,295 194,310 206,310" fill="url(#brand)"/>
  <!-- Horizontal line on arrow shaft -->
  <line x1="186" y1="325" x2="214" y2="325" stroke="url(#brand)" stroke-width="2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="200" y="375" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="white" text-anchor="middle">PARL</text>
</svg>
