<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="170" r="130" fill="url(#glow)"/>

  <!-- Ripple rings -->
  <circle cx="200" cy="170" r="105" stroke="url(#brandG)" stroke-width="3" fill="none" opacity="0.12"/>
  <circle cx="200" cy="170" r="80" stroke="url(#brandG)" stroke-width="2.5" fill="none" opacity="0.28"/>
  <circle cx="200" cy="170" r="58" stroke="url(#brandG)" stroke-width="2" fill="none" opacity="0.45"/>
  <circle cx="200" cy="170" r="40" stroke="url(#brandG)" stroke-width="3" fill="none" opacity="0.7"/>
  <circle cx="200" cy="170" r="14" fill="url(#brandG)"/>

  <!-- Upward prediction arrow -->
  <line x1="200" y1="370" x2="200" y2="320" stroke="url(#brandG)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="200,303 193,320 207,320" fill="url(#brandG)"/>
  <line x1="184" y1="338" x2="216" y2="338" stroke="url(#brandG)" stroke-width="2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="200" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="650" letter-spacing="6" fill="white" text-anchor="middle">PARL</text>
</svg>
